spring.application.name=lost-and-found-portal
server.port=8080

# MySQL DataSource (uses environment variables if provided, with safe defaults)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lost_and_found_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# File Upload Settings
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=uploads

# JWT Security Config
app.jwt.secret=${JWT_SECRET:LostAndFoundSecretKeyMustBeVeryLongToSatisfyHmacSha256Requirement2026}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Initial Administrator Configuration (Driven by env vars)
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:Admin@Secure2026!}
app.admin.email=${APP_ADMIN_EMAIL:admin@lostfound.com}
app.admin.fullname=${APP_ADMIN_FULLNAME:System Administrator}
app.admin.phone=${APP_ADMIN_PHONE:9876543210}
app.admin.reset-password-on-startup=${APP_ADMIN_RESET_PASSWORD:false}

# Spring Boot Mail / SMTP Configuration
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Application Mail Settings
app.mail.enabled=${APP_MAIL_ENABLED:true}
app.mail.from=${MAIL_FROM:noreply@lostfoundportal.com}
app.mail.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.mail.portal-name=Lost & Found Portal


